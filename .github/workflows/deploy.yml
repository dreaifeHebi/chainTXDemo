name: Check Cloudflare Pages build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error

      - name: Deployment ownership
        run: echo 'Cloudflare Pages Git integration independently runs the same checks and deploys master. No Cloudflare token is required in GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
