participants:
  - el_type: geth
    cl_type: lighthouse
    count: 2

network_params:
  network: kurtosis
  network_id: "20230618"
  seconds_per_slot: 4
  slot_duration_ms: 4000
  num_validator_keys_per_node: 128

# The snooper records full Beacon/Engine API request and response bodies and can
# grow by tens of GB per day. Enable it only for short, monitored captures.
snooper_params:
  enabled: false

additional_services:
  - dora
  - prometheus
  - grafana

ethereum_metrics_exporter_enabled: true
